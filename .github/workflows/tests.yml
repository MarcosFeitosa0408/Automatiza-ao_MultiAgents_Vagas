name: Testes Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plataforma_vagas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plataforma_vagas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plataforma_vagas

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes
        run: python -m pytest -v

  postgres-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plataforma_vagas
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d plataforma_vagas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      REPOSITORY_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/plataforma_vagas

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar teste PostgreSQL real
        run: python -m pytest -v tests/integration/test_real_postgres_persistence.py


        
